syntax = "proto3";

// The protocol between a worker and the server.
//
// The package carries a version. A change that a running worker cannot
// understand goes into quorra.v2 beside this, so that a server can answer
// both while the workers are replaced. Without the version there is no way to
// do that except by taking everything down at once.
package quorra.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Stiven-Gjekaj/GoQuorra/internal/quorrapb;quorrapb";

// QueueService is what a worker talks to.
service QueueService {
  // Lease asks for work and returns what is available now.
  //
  // This is one call and one answer, where the previous version declared a
  // server stream. That stream sent whatever was ready and then closed, which
  // is a single answer written in a way that costs the client a receive loop
  // and an end of file to handle. Nothing was ever pushed down it.
  //
  // A stream that stays open and pushes a job the moment it arrives is a real
  // design, and it is not this one. docs/milestones.md says what it would
  // need.
  rpc Lease(LeaseRequest) returns (LeaseResponse);

  // Report says what happened to a job.
  //
  // One call, with the outcome as a field that the server reads. The previous
  // version had AckJob and NackJob, and a success field on the message that
  // no code ever read, so a worker that set it to false and called AckJob was
  // recorded as having succeeded.
  rpc Report(ReportRequest) returns (ReportResponse);

  // Heartbeat pushes the expiry of a lease further out.
  //
  // A worker calls it while a handler is still running, so that a job slower
  // than the lease it was given is not taken back and handed to somebody
  // else. The refusal is the useful part: a job that was cancelled, or one
  // whose lease already ran out and was reclaimed, fails this call with
  // FAILED_PRECONDITION, and that is how a worker learns to stop.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Watch tells a worker when there may be work, so that it can ask at once
  // rather than waiting out its poll.
  //
  // It is a hint and never a promise. Every message says a queue may have
  // work, and the worker answers by calling Lease, which is the call that
  // decides. A message that is lost costs latency and nothing else, because
  // the worker still polls: that is what makes this safe to add to a
  // protocol whose correctness already worked without it.
  //
  // The previous version of this project declared Lease as a server stream,
  // which looked like a push and was not: it sent whatever was ready and
  // closed. This is a stream that stays open and carries no jobs.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

// Job is one piece of work.
message Job {
  string id = 1;
  string type = 2;

  // payload is the JSON the client submitted, as bytes. The server does not
  // look inside it.
  bytes payload = 3;

  string queue = 4;
  int32 priority = 5;

  // attempts counts this run as well as the ones before it, so the first run
  // of a job reports 1.
  int32 attempts = 6;
  int32 max_retries = 7;

  // lease_id must be sent back in the report. A job whose lease has been
  // taken back carries a different one, and the report is then refused.
  string lease_id = 8;

  // lease_expires_at is when the server takes the job back. A worker still
  // running at that moment is going to have its work repeated by somebody
  // else, so it is worth checking.
  google.protobuf.Timestamp lease_expires_at = 9;

  google.protobuf.Timestamp run_at = 10;
  google.protobuf.Timestamp created_at = 11;
}

message LeaseRequest {
  string worker_id = 1;
  string queue = 2;
  int32 max_jobs = 3;

  // lease_ttl is how long the worker asks to hold the jobs. A Duration and
  // not a count of seconds, so that a wrong unit cannot be sent silently.
  google.protobuf.Duration lease_ttl = 4;
}

message LeaseResponse {
  repeated Job jobs = 1;
}

// Outcome is what the worker reports.
enum Outcome {
  // The server refuses this value. A field left unset must not mean success,
  // because that is what an older or broken client sends.
  OUTCOME_UNSPECIFIED = 0;

  OUTCOME_SUCCEEDED = 1;
  OUTCOME_FAILED = 2;

  // The worker read the job and says no attempt will finish it. The server
  // buries the job at once, whatever its attempt count.
  //
  // A server built before this value sees a number it does not know, and the
  // mapping it already has answers with an error rather than reading an
  // unknown number as a success. That is why the unset value is not success.
  OUTCOME_REFUSED = 3;
}

message ReportRequest {
  string job_id = 1;
  string worker_id = 2;
  string lease_id = 3;
  Outcome outcome = 4;

  // error is kept on the job and shown in the dashboard. It is ignored when
  // the outcome is a success.
  string error = 5;

  // result is what the job produced, as JSON. It is kept only when the
  // outcome is a success, because the output of an attempt that failed is not
  // an output.
  //
  // The server bounds it. A queue is not a place to put a large value: put
  // that where it belongs and report a reference to it here.
  bytes result = 6;
}

message HeartbeatRequest {
  string job_id = 1;
  string worker_id = 2;
  string lease_id = 3;

  // extend_by is how much longer the worker is asking for, measured from the
  // moment the server handles the call.
  google.protobuf.Duration extend_by = 4;
}

message HeartbeatResponse {
  // lease_expires_at is the new expiry. A worker that is close to it and
  // still working knows its next heartbeat matters.
  google.protobuf.Timestamp lease_expires_at = 1;
}

message ReportResponse {
  // status is where the job ended up: pending when it will be retried,
  // succeeded, or dead.
  string status = 1;

  int32 attempts = 2;

  // run_at is when a retried job comes back. It holds the backoff the server
  // applied, so a worker can log it.
  google.protobuf.Timestamp run_at = 3;
}

// WatchRequest asks to be told when a queue may have work.
message WatchRequest {
  // worker_id names the worker, for the server log. It grants nothing: the
  // key in the call metadata is what says a caller may watch.
  string worker_id = 1;

  // queues are the queues to be told about. Empty is refused rather than
  // read as "all of them": a worker that watched every queue would be woken
  // by work it cannot take.
  repeated string queues = 2;
}

// WatchResponse says that a queue may have work.
//
// It carries no job. Handing a job down this stream would make it a second
// way to lease one, with its own rules about leases and its own way to go
// wrong, and Lease is the call that already does it.
message WatchResponse {
  // queue is the queue that may have work.
  string queue = 1;

  // reason says what made the server send this, for a log line. It is not
  // something to branch on: a worker that treated one reason differently
  // from another would depend on a detail of when the server notices things.
  string reason = 2;
}
