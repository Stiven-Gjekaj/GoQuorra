<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoQuorra</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style nonce="{{.Nonce}}">
:root {
  --ink: #16191d; --dim: #5b6670; --line: #dfe3e8;
  --ground: #f5f6f8; --panel: #ffffff;
  --pending: #9a6700; --leased: #0b5ed7; --succeeded: #1a7f37; --dead: #b42318;
  --blocked: #5b6670;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e6e9ec; --dim: #98a1ab; --line: #2c333b;
    --ground: #14171a; --panel: #1c2126;
    --pending: #d4a72c; --leased: #6cb6ff; --succeeded: #57ab5a; --dead: #ff7b72;
    --blocked: #98a1ab;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
header { border-bottom: 1px solid var(--line); background: var(--panel); }
.bar { max-width: 1100px; margin: 0 auto; padding: 18px 20px; display: flex; gap: 12px; align-items: baseline; }
h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
/* The bar lines its children up on the baseline, which a picture has none
   of, so the mark is centred against the row instead. */
.mark { width: 26px; height: 26px; align-self: center; border-radius: 7px; }
/* The spacer that pushes the key form to the right edge.
   It is a class and not a style attribute. The policy on this page names a
   nonce for style, and a nonce does not apply to an attribute, so an inline
   style is refused by the browser and does nothing. That failure is silent
   apart from a line in a console nobody has open. */
.spacer { flex: 1; }
.tag { color: var(--dim); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--dim); }
.row { display: flex; justify-content: space-between; padding: 2px 0; font-variant-numeric: tabular-nums; }
h3 { font-size: 14px; margin: 0 0 10px; color: var(--dim); font-weight: 600; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.pending { color: var(--pending); } .leased { color: var(--leased); }
.succeeded { color: var(--succeeded); } .dead { color: var(--dead); }
/* Grey, and quieter than the rest. A waiting job is not a problem and not a
   result: it is a job nobody has to look at yet. */
.blocked { color: var(--blocked); }
.note { color: var(--dim); padding: 16px; }
/* A schedule that is switched off. Dimmed and not hidden: somebody switched
   it, and hiding it would leave them looking for it. */
tr.off td { color: var(--dim); }
td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input, button {
  font: inherit; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
button { cursor: pointer; }
.err { color: var(--dead); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.filters button { font-size: 13px; padding: 5px 11px; }
.filters button[aria-pressed="true"] { border-color: var(--leased); color: var(--leased); font-weight: 600; }
td.act { white-space: nowrap; }
/* The error is the widest thing on the row and the least urgent. Capped with
   the full text on the title, so it cannot push the buttons at the end of the
   row off the side of the table. */
td.why { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
td.waiting { color: var(--muted); }
td.act button { font-size: 12px; padding: 3px 9px; margin-right: 5px; }
button.open {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
  padding: 2px 6px; background: none; border: 0; color: var(--leased);
  cursor: pointer; text-decoration: underline;
}
.more { padding: 12px; text-align: center; }
#detail {
  margin-top: 24px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 16px;
}
#detail h3 { margin-top: 0; }
#detail pre {
  background: var(--ground); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px; overflow-x: auto; font-size: 13px; margin: 0 0 12px 0;
}
#detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 14px 0; }
#detail dt { color: var(--dim); font-size: 13px; }
#detail dd { margin: 0; font-size: 13px; }
.close { float: right; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <!-- The mark is decorative, and the heading beside it already says the
         name. An alt holding that name again would have a screen reader read
         it twice. -->
    <img class="mark" src="/logo.svg" alt="" width="26" height="26">
    <h1>GoQuorra</h1>
    <span class="tag" id="state">connecting</span>
    <!-- Which key is in use. A key limited to queues shows an empty listing
         for a queue it cannot reach, which reads exactly like an empty
         queue, so the page says which key it is holding. -->
    <span class="tag" id="who" hidden></span>
    <span class="spacer"></span>
    <form id="keyform">
      <label for="key" class="tag">API key</label>
      <input id="key" type="password" autocomplete="off" size="26" placeholder="X-API-Key">
      <button type="submit">Use</button>
    </form>
  </div>
</header>

<main>
  <h3>Queues</h3>
  <div class="cards" id="queues"></div>

  <!-- Is anything out there. A queue that is filling up because no worker
       has asked for work looks exactly like a queue that is filling up
       because the work is slow, and the difference is this list. -->
  <h3>Workers</h3>
  <div class="cards" id="workers"></div>

  <!-- The repeat schedules. A schedule that is switched off produces
       nothing and looks, from the jobs table, exactly like one that is
       working and has nothing due. -->
  <h3>Schedules</h3>
  <div class="scroll">
    <table>
      <thead>
        <tr><th>Name</th><th>Rule</th><th>Zone</th><th>Queue</th><th>Catch up</th><th>Last fired</th><th>Next</th><th>Actions</th></tr>
      </thead>
      <tbody id="schedules"></tbody>
    </table>
  </div>

  <h3>Jobs</h3>
  <form id="findform">
    <label for="find" class="tag">Find</label>
    <input id="find" type="search" size="40" placeholder="a job identifier">
    <button type="submit">Open</button>
  </form>
  <div class="filters" id="filters"></div>
  <!-- Acting on everything the filter names. Empty unless a status is
       chosen, because "cancel all of them" must not be one press away. -->
  <div class="filters" id="bulk"></div>
  <div class="scroll">
    <table>
      <thead>
        <tr><th>Job</th><th>Type</th><th>Queue</th><th>Status</th><th>Attempts</th><th>Created</th><th>Runs at</th><th>Outcome</th><th>Actions</th></tr>
      </thead>
      <tbody id="jobs"></tbody>
    </table>
    <div class="more" id="more"></div>
  </div>

  <!-- Hidden until a job is opened. A panel and not a second page, because
       the reader came from a row and wants to go back to it. -->
  <section id="detail" hidden>
    <h3 id="detailtitle"></h3>
    <div id="detailbody"></div>
  </section>
</main>

<script nonce="{{.Nonce}}">
// The key is never written into this page.
//
// The old dashboard had the key printed into its source and sent it in the
// query string of every request. A query string is written to the access log
// of every proxy, kept in browser history, and sent on in the Referer header.
// The reader supplies the key here, the browser keeps it for this tab only,
// and it travels in a header.
"use strict";

const store = window.sessionStorage;
const state = document.getElementById("state");
const keyInput = document.getElementById("key");

keyInput.value = store.getItem("quorra.key") || "";

document.getElementById("keyform").addEventListener("submit", (event) => {
  event.preventDefault();
  store.setItem("quorra.key", keyInput.value);
  // Through restart and not load, because a reader correcting a key is
  // saying that the reason for the failures before it is gone.
  restart();
});

function say(text, bad) {
  state.textContent = text;
  state.className = bad ? "tag err" : "tag";
}

// Which status the reader is looking at. Empty means all of them.
let filter = "";

// The key whoami was last asked about. Asking again on every refresh would
// put a request every five seconds on an answer that changes only when the
// reader types a different key.
let askedAbout = null;

// The pages already fetched, and the cursor for the next one.
//
// The rows are kept rather than the cursors. A reader who has pressed for
// more four times is looking at a hundred rows, and the refresh has to give
// them a hundred rows back or the page they were reading disappears under
// them every five seconds.
let pages = 1;

async function post(path, body) {
  const headers = { "X-API-Key": store.getItem("quorra.key") || "" };
  if (body !== undefined) headers["Content-Type"] = "application/json";

  const response = await fetch(path, {
    method: "POST",
    headers,
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!response.ok) {
    const answer = await response.json().catch(() => ({}));
    throw new Error(answer.error || ("the server answered " + response.status));
  }
  return response.json();
}

async function get(path) {
  const response = await fetch(path, {
    headers: { "X-API-Key": store.getItem("quorra.key") || "" },
    cache: "no-store",
  });
  if (response.status === 401) throw new Error("the API key is missing or wrong");
  if (!response.ok) throw new Error("the server answered " + response.status);
  return response.json();
}

// Every value below is written with textContent or through createTextNode.
//
// The old dashboard built each row by joining strings and assigning the
// result straight into the page as markup. Two of the values in a row, the
// job type and the queue name, are chosen by whoever submits a job, so
// anybody who could reach the submission endpoint could put a script into
// this page and have it run with the reader's key in their browser.
// jobsPath builds the query for one page.
function jobsPath(cursor) {
  let path = "/v1/jobs?limit=" + PAGE;
  if (filter === "ready") {
    // Pending as well as due. A finished job keeps the run_at of its last
    // attempt, so asking only what is due lists every job that has ever run,
    // which is the opposite of what this button says.
    path += "&status=pending&due=now&order=soonest";
  } else if (filter) {
    path += "&status=" + encodeURIComponent(filter);
  }
  if (cursor) path += "&before=" + encodeURIComponent(cursor);
  return path;
}

// How many rows one page holds.
const PAGE = 25;

// renderMore draws the button that fetches the next page.
//
// A button and not an endless scroll. A reader looking for one job among
// thousands wants to stop, and a page that keeps growing while they read has
// no place to stop at.
function renderMore(shown, next) {
  const holder = document.getElementById("more");
  holder.replaceChildren();

  if (!next) {
    if (shown > PAGE) holder.textContent = "All " + shown + " shown.";
    return;
  }

  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "Show " + PAGE + " more (" + shown + " so far)";
  button.addEventListener("click", () => {
    pages++;
    restart();
  });
  holder.appendChild(button);
}

function cell(row, text, className) {
  const td = document.createElement("td");
  td.textContent = text === null || text === undefined ? "" : String(text);
  if (className) td.className = className;
  row.appendChild(td);
  return td;
}

// showWho names the key in use, and the queues it holds when it holds some.
//
// A key that holds every queue says so by naming none, and a line saying "on
// every queue" would sit on the page for ever to report that nothing is
// limited.
async function showWho() {
  const key = store.getItem("quorra.key") || "";
  if (key === askedAbout) return;

  const badge = document.getElementById("who");
  const answer = await get("/v1/whoami");
  askedAbout = key;

  let text = answer.name + " (may " + answer.scope;
  if (Array.isArray(answer.queues) && answer.queues.length > 0) {
    text += ", on " + answer.queues.join(", ");
  }
  badge.textContent = text + ")";
  badge.hidden = false;
}

// renderSchedules shows the repeat schedules and lets one be switched.
//
// A schedule that is switched off produces nothing, and from the jobs table
// that looks exactly like a schedule that is working and has nothing due.
// The row says which it is.
function renderSchedules(rows) {
  const body = document.getElementById("schedules");
  body.replaceChildren();

  if (rows.length === 0) {
    const row = body.insertRow();
    const only = cell(row, "No repeat schedules.");
    only.colSpan = 8;
    only.className = "note";
    return;
  }

  for (const one of [...rows].sort((a, b) => a.name.localeCompare(b.name))) {
    const row = body.insertRow();
    if (!one.enabled) row.className = "off";

    cell(row, one.name);
    cell(row, one.cron, "mono");
    cell(row, one.timezone || "UTC");
    cell(row, one.queue || "default");
    cell(row, one.catch_up);
    cell(row, one.last_fired_at ? whenText(one.last_fired_at) : "never");

    // A rule that names a day which never comes has no next firing, and a
    // schedule that is off has none either. The two read differently and
    // the second is the one somebody switched.
    if (!one.enabled) {
      cell(row, "off", "dead");
    } else if (one.error) {
      cell(row, one.error, "dead");
    } else {
      cell(row, one.next_firing_at ? whenText(one.next_firing_at) : "never", "");
    }

    const actions = row.insertCell();
    actions.appendChild(scheduleButton(
      one.enabled ? "Switch off" : "Switch on",
      one.name, one.enabled ? "disable" : "enable"));
  }
}

// scheduleButton switches one schedule and asks for the page again.
function scheduleButton(label, name, verb) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      await post("/v1/schedules/" + encodeURIComponent(name) + "/" + verb);
      await load();
    } catch (error) {
      say(error.message, true);
      button.disabled = false;
    }
  });
  return button;
}

// whenText gives a moment in the reader's own zone.
function whenText(stamp) {
  const at = new Date(stamp);
  return Number.isNaN(at.getTime()) ? String(stamp) : at.toLocaleString();
}

// renderWorkers shows the workers the queue has heard from.
//
// Grouped by worker and not by queue. One worker asking for two queues is one
// process, and a reader counting rows to find out how many are running would
// count it twice.
function renderWorkers(rows) {
  const holder = document.getElementById("workers");
  holder.replaceChildren();

  if (rows.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card note";
    empty.textContent = "No worker has asked for work.";
    holder.appendChild(empty);
    return;
  }

  const byWorker = new Map();
  for (const row of rows) {
    if (!byWorker.has(row.id)) byWorker.set(row.id, []);
    byWorker.get(row.id).push(row);
  }

  for (const [worker, seen] of [...byWorker].sort()) {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = worker;
    card.appendChild(title);

    // The longest silence across the queues it asked about. A worker that
    // asked one queue a second ago is working, whatever the other says.
    const idle = Math.min(...seen.map((one) => one.idle_seconds));

    const when = document.createElement("div");
    when.className = "row";
    const label = document.createElement("span");
    label.textContent = "last asked";
    const value = document.createElement("span");
    value.textContent = idleText(idle);
    // A worker nobody has heard from is the thing this list is for, so it
    // is coloured like a job that stopped rather than left to be read.
    if (idle >= 60) value.className = "dead";
    when.append(label, value);
    card.appendChild(when);

    const where = document.createElement("div");
    where.className = "row";
    const queuesLabel = document.createElement("span");
    queuesLabel.textContent = "queues";
    const queuesValue = document.createElement("span");
    queuesValue.textContent = seen.map((one) => one.queue).sort().join(", ");
    where.append(queuesLabel, queuesValue);
    card.appendChild(where);

    holder.appendChild(card);
  }
}

// idleText says how long ago in words a person uses.
function idleText(seconds) {
  if (seconds < 2) return "just now";
  if (seconds < 90) return Math.round(seconds) + "s ago";
  if (seconds < 5400) return Math.round(seconds / 60) + "m ago";
  return Math.round(seconds / 3600) + "h ago";
}

function renderQueues(rows) {
  const byQueue = new Map();
  for (const row of rows) {
    if (!byQueue.has(row.queue)) byQueue.set(row.queue, []);
    byQueue.get(row.queue).push(row);
  }

  const holder = document.getElementById("queues");
  holder.replaceChildren();

  if (byQueue.size === 0) {
    const empty = document.createElement("div");
    empty.className = "card note";
    empty.textContent = "No jobs yet.";
    holder.appendChild(empty);
    return;
  }

  for (const [queue, counts] of [...byQueue].sort()) {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = queue;
    card.appendChild(title);

    for (const entry of counts) {
      const line = document.createElement("div");
      line.className = "row";

      const name = document.createElement("span");
      name.textContent = entry.status;
      name.className = entry.status;

      const value = document.createElement("span");
      value.textContent = entry.count;

      line.append(name, value);
      card.appendChild(line);
    }
    holder.appendChild(card);
  }
}

// The statuses the filter row offers. Taken from what the server can hold,
// not from what happens to be in the table right now, so a status with no
// jobs in it is still a button somebody can press.
const STATUSES = ["blocked", "pending", "leased", "succeeded", "dead", "cancelled"];

// The states a job never leaves. A job in any other state can be cancelled,
// and the buttons are decided from this rather than from a second list of the
// states that can be.
const FINISHED = ["succeeded", "dead", "cancelled"];

function renderFilters() {
  const holder = document.getElementById("filters");
  holder.replaceChildren();

  // ready is not a status, so it is not in STATUSES. It sits in the same row
  // because it answers the same question a reader is asking when they press
  // one of these: show me less than everything.
  const choices = [["", "all"]].concat(STATUSES.map((s) => [s, s])).concat([["ready", "ready"]]);

  for (const [value, label] of choices) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", String(filter === value));
    button.addEventListener("click", () => {
      filter = value;
      renderFilters();
      load();
    });
    holder.appendChild(button);
  }
}

// The action that a status calls for.
//
// Cancel is for a job that has not finished, and revive is for one that has.
// A status that is already finished has no cancel, and one that is still
// going has no revive, so a page that offered both would offer one that
// answers an error whatever is pressed.
const BULK = {
  pending: ["cancel", "Cancel"],
  blocked: ["cancel", "Cancel"],
  leased: ["cancel", "Cancel"],
  dead: ["revive", "Revive"],
  cancelled: ["revive", "Revive"],
};

// renderBulk offers one action over everything the filter names.
//
// Only when a status is chosen. The filter that names every job is the one
// nobody means to act on, and "cancel all of them" must not be one press
// away from a page somebody opened to look at it.
//
// Bounded by what is on the page. The reader narrows until the table shows
// what they mean and then acts on that, so nothing moves that they have not
// seen. Pressing again takes the next page of them.
function renderBulk(shown) {
  const holder = document.getElementById("bulk");
  holder.replaceChildren();

  const action = BULK[filter];
  if (!action || shown === 0) return;

  const [verb, label] = action;
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label + " these " + shown;
  button.addEventListener("click", async () => {
    if (!window.confirm(label + " " + shown + " " + filter + " job(s)?")) return;

    button.disabled = true;
    try {
      const answer = await post("/v1/jobs/" + verb, { status: filter, limit: shown });
      say(label.toLowerCase() + "d " + answer.moved);
      await load();
    } catch (error) {
      say(error.message, true);
      button.disabled = false;
    }
  });
  holder.appendChild(button);
}

// untilText says how far off a moment is, in the shortest form that is still
// true. A job that is ready reads as "now" rather than as a negative number.
function untilText(moment) {
  const seconds = Math.round((moment - new Date()) / 1000);
  if (seconds <= 0) return "now";
  if (seconds < 60) return "in " + seconds + "s";
  if (seconds < 3600) return "in " + Math.round(seconds / 60) + "m";
  if (seconds < 86400) return "in " + Math.round(seconds / 3600) + "h";
  return "in " + Math.round(seconds / 86400) + "d";
}

// A button that acts on one job, and says what happened where the reader is
// already looking rather than in a box they have to dismiss.
function action(row, label, path, id) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      await post("/v1/jobs/" + encodeURIComponent(id) + "/" + path);
      await load();
    } catch (error) {
      say(error.message, true);
      button.disabled = false;
    }
  });
  row.appendChild(button);
}

function renderJobs(list) {
  const body = document.getElementById("jobs");
  body.replaceChildren();
  document.getElementById("more").textContent = "";

  if (!list || list.length === 0) {
    const row = document.createElement("tr");
    const td = cell(row, filter ? "No " + filter + " jobs." : "No jobs yet.");
    td.colSpan = 9;
    td.className = "note";
    body.appendChild(row);
    return;
  }

  for (const job of list) {
    const row = document.createElement("tr");

    // A button and not a link. A link would need an address, and this page
    // has one address: putting a job identifier in it would put that
    // identifier in the browser history and in the Referer of anything the
    // page later fetched.
    const first = cell(row, "");
    const open = document.createElement("button");
    open.type = "button";
    open.className = "open";
    open.textContent = String(job.id).slice(0, 8);
    open.title = job.id;
    open.addEventListener("click", () => openJob(job.id));
    first.appendChild(open);

    cell(row, job.type);
    cell(row, job.queue);

    // Who moved the job, on the status cell rather than in a column of its
    // own. Only cancel and revive record a name, so a column would be empty
    // on almost every row, and this table is already nine wide.
    //
    // A dot marks the rows that carry one, because a title nobody can see
    // is a title nobody hovers.
    const state = cell(row, job.status, job.status);
    if (job.acted_by) {
      state.textContent = job.status + " *";
      state.title = "by " + job.acted_by + " on " + new Date(job.acted_at).toLocaleString();
    }

    // A waiting job says how many jobs it waits for, and names them on the
    // cell. "blocked" on its own is the question and not the answer.
    if (job.status === "blocked" && job.after && job.after.length) {
      state.textContent = "blocked (" + job.after.length + ")";
      state.title = "waits for " + job.after.join(", ");
    }

    cell(row, job.attempts + " of " + (job.max_retries + 1));
    // A short form for today and a date for anything older. The full moment
    // is on the title. A column holding the date and the seconds of every
    // row is the widest thing in the table and is read by nobody.
    const created = new Date(job.created_at);
    const today = new Date().toDateString() === created.toDateString();
    const when = cell(row, today
      ? created.toLocaleTimeString()
      : created.toLocaleDateString());
    when.title = created.toLocaleString();

    // When the job runs, and how far off that is.
    //
    // A job pending with a run_at two hours out looks exactly like one that
    // is ready this second in every other column on this row. The relative
    // form is what a reader wants: "in 2h" answers the question, and the
    // moment itself hangs off the cell for whoever needs it.
    // A blocked job has a run time and it means nothing: the job runs when
    // its parents succeed, and showing "now" beside a job that will not run
    // is the clearest way to make a reader distrust the whole column.
    const runs = new Date(job.run_at);
    const runsCell = cell(row, job.status === "pending" ? untilText(runs)
      : job.status === "blocked" ? "waiting" : "");
    runsCell.title = runs.toLocaleString();
    if (job.status === "pending" && runs > new Date()) {
      runsCell.className = "waiting";
    }

    // One column for what came of the job, because a job has an error or a
    // result and never both worth showing.
    //
    // The column is headed Outcome and not Last error. It held that name
    // while it also showed the word "result", which put a successful job
    // under a heading that says it failed.
    //
    // The status decides which of the two is shown, and not which field
    // happens to be filled in. last_error is deliberately kept when a job
    // succeeds, so a job that failed once and then worked carries both, and
    // preferring the error showed the stale failure and hid what the job
    // actually produced.
    const succeeded = job.status === "succeeded";
    const last = cell(row, "");
    last.className = "why";
    if (succeeded && job.result) {
      last.textContent = "result";
      last.title = JSON.stringify(job.result);
    } else if (!succeeded && job.last_error) {
      last.textContent = job.last_error;
      last.title = job.last_error;
    }

    // Only the actions the server would accept. A button that always answers
    // 409 teaches the reader to ignore the row.
    //
    // Written as "not finished" rather than as a list of states. The list was
    // there first and went stale on the first state added after it: a waiting
    // job could be cancelled by every other route and had no button here.
    const acts = cell(row, "");
    acts.className = "act";
    if (!FINISHED.includes(job.status)) {
      action(acts, "cancel", "cancel", job.id);
    }
    if (job.status === "dead" || job.status === "cancelled") {
      action(acts, "revive", "revive", job.id);
    }

    body.appendChild(row);
  }
}

// Which job the panel is showing. Empty means it is closed.
let opened = "";

document.getElementById("findform").addEventListener("submit", (event) => {
  event.preventDefault();
  const wanted = document.getElementById("find").value.trim();
  if (wanted) openJob(wanted);
});

// openJob draws the panel for one job.
//
// Two requests: the job and what it did. The history is its own route on the
// server for the same reason it is a second request here, and joining them
// would put the history of every job into every listing.
async function openJob(id) {
  opened = id;
  const title = document.getElementById("detailtitle");
  const body = document.getElementById("detailbody");
  const panel = document.getElementById("detail");

  panel.hidden = false;
  title.replaceChildren();
  body.replaceChildren();

  const close = document.createElement("button");
  close.type = "button";
  close.className = "close";
  close.textContent = "Close";
  close.addEventListener("click", () => {
    opened = "";
    panel.hidden = true;
  });
  title.appendChild(close);
  title.appendChild(document.createTextNode("Job " + id));

  let job, history;
  try {
    [job, history] = await Promise.all([
      get("/v1/jobs/" + encodeURIComponent(id)),
      get("/v1/jobs/" + encodeURIComponent(id) + "/attempts"),
    ]);
  } catch (error) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = error.message;
    body.appendChild(note);
    return;
  }

  const facts = document.createElement("dl");
  const fact = (name, value) => {
    if (value === undefined || value === null || value === "") return;
    const dt = document.createElement("dt");
    dt.textContent = name;
    const dd = document.createElement("dd");
    dd.textContent = String(value);
    facts.appendChild(dt);
    facts.appendChild(dd);
  };
  fact("Type", job.type);
  fact("Queue", job.queue);
  fact("Status", job.status);
  fact("Attempts", job.attempts + " of " + (job.max_retries + 1));
  fact("Priority", job.priority);
  fact("Created", new Date(job.created_at).toLocaleString());
  fact("Runs at", new Date(job.run_at).toLocaleString());
  fact("Held by", job.leased_by);
  fact("Held since", job.leased_at ? new Date(job.leased_at).toLocaleString() : "");
  fact("Waits for", (job.after || []).join(", "));
  fact("Acted on by", job.acted_by);
  fact("Idempotency key", job.idempotency_key);
  fact("Last error", job.last_error);
  body.appendChild(facts);

  // The payload, which is the thing a person opening a job came for and the
  // one field the listing can never show.
  body.appendChild(heading("Payload"));
  body.appendChild(pre(job.payload));
  if (job.result !== undefined) {
    body.appendChild(heading("Result"));
    body.appendChild(pre(job.result));
  }

  body.appendChild(heading("What it did"));
  const runs = history.attempts || [];
  if (!runs.length) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = "This job has not finished a run.";
    body.appendChild(note);
    return;
  }

  const table = document.createElement("table");
  const head = document.createElement("thead");
  const headRow = document.createElement("tr");
  for (const name of ["Run", "Worker", "Outcome", "Took", "Error"]) {
    const th = document.createElement("th");
    th.textContent = name;
    headRow.appendChild(th);
  }
  head.appendChild(headRow);
  table.appendChild(head);

  const rows = document.createElement("tbody");
  for (const run of runs) {
    const row = document.createElement("tr");
    cell(row, run.attempt);
    cell(row, run.worker || "unknown");
    cell(row, run.outcome, run.outcome === "done" ? "succeeded" : "dead");
    cell(row, tookText(run));
    const why = cell(row, run.error || "");
    why.className = "why";
    why.title = run.error || "";
    rows.appendChild(row);
  }
  table.appendChild(rows);
  body.appendChild(table);
}

// tookText gives how long a run lasted, or a dash when that is not known.
//
// A job leased by a build older than the history has no recorded start.
// Measuring from the zero time would give every one of those rows the same
// wrong answer, in decades, and it would look like a real number.
function tookText(run) {
  if (!run.started_at || !run.finished_at) return "-";
  const ms = new Date(run.finished_at) - new Date(run.started_at);
  if (ms < 1000) return ms + "ms";
  return (ms / 1000).toFixed(3) + "s";
}

function heading(text) {
  const h = document.createElement("h4");
  h.textContent = text;
  return h;
}

// pre renders a JSON value, formatted, as text and never as markup.
//
// The payload is chosen by whoever submits the job, so this is the value most
// worth being careful with on the whole page.
function pre(value) {
  const block = document.createElement("pre");
  block.textContent = JSON.stringify(value, null, 2);
  return block;
}

// load draws the page once, and reports whether it worked.
//
// It answers rather than throwing, because the caller is a timer and the
// decision it has to make is how long to wait before asking again.
async function load() {
  if (!store.getItem("quorra.key")) {
    say("enter the API key", true);
    return false;
  }
  try {
    // ready asks a different question from a status, so it builds a
    // different query: what the queue would hand out now, in the order it
    // would hand it out. A list of ready jobs in submission order does not
    // answer what runs next.
    await showWho();

    const queues = await get("/v1/queues");
    renderQueues(queues.queues || []);

    const seen = await get("/v1/workers");
    renderWorkers(seen.workers || []);

    const repeats = await get("/v1/schedules");
    renderSchedules(repeats.schedules || []);

    // Every page the reader has asked for, one after another, following the
    // cursor. Asking for a bigger limit instead would work until somebody
    // pressed for more twenty times and then asked the server for five
    // hundred rows in one query.
    let rows = [];
    let cursor = "";
    let next = "";
    for (let page = 0; page < pages; page++) {
      const answer = await get(jobsPath(cursor));
      rows = rows.concat(answer.jobs || []);
      next = answer.next_cursor || "";
      if (!next) break;
      cursor = next;
    }

    renderJobs(rows);
    renderMore(rows.length, next);
    renderBulk(rows.length);

    // The open panel is drawn again with the rest. A job somebody is
    // watching because it is stuck is the job whose status they are waiting
    // to see change.
    if (opened) await openJob(opened);

    say("updated " + new Date().toLocaleTimeString());
    return true;
  } catch (error) {
    say(error.message, true);
    return false;
  }
}

// The request lifecycle.
//
// The page used to refresh on a fixed five second interval and nothing else,
// which meant a wrong key made two failing requests every five seconds for as
// long as the tab was open, a tab left in the background polled until it was
// closed, and a server that had gone away was asked again at exactly the same
// rate for ever. docs/milestones.md recorded all three and left them.
//
// Three rules replace it.
const BASE = 5000;   // How often a healthy page asks.
const CEILING = 60000; // The longest it ever waits.
const GIVE_UP = 6;   // Failures in a row before it stops asking.

let wait = BASE;
let failures = 0;
let timer = null;
let stopped = false;

function schedule() {
  if (timer) clearTimeout(timer);
  if (stopped) return;

  // A hidden tab is asked for nothing. The visibility handler starts it
  // again, so a reader who comes back gets a refresh at once rather than
  // waiting out whatever the backoff had grown to.
  if (document.hidden) return;

  timer = setTimeout(tick, wait);
}

async function tick() {
  const ok = await load();
  if (ok) {
    failures = 0;
    wait = BASE;
  } else {
    failures++;
    if (failures >= GIVE_UP) {
      stopped = true;
      say("stopped after " + failures + " failures. Press Use to try again.", true);
      return;
    }
    // Doubling, up to a ceiling. A server that has gone away is asked less
    // and less rather than at the same rate for ever, and a page that comes
    // back is at most a minute behind.
    wait = Math.min(wait * 2, CEILING);
  }
  schedule();
}

// A reader coming back to the tab gets an answer at once.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (timer) clearTimeout(timer);
    return;
  }
  restart();
});

// restart clears the backoff and asks now. The key form calls it too: a
// reader who has just corrected a key is saying that the reason for the
// failures is gone.
function restart() {
  stopped = false;
  failures = 0;
  wait = BASE;
  // A different key is a different caller, so what it may see is asked
  // again rather than kept from the key before it.
  askedAbout = null;
  if (timer) clearTimeout(timer);
  tick();
}

renderFilters();
restart();
</script>
</body>
</html>
