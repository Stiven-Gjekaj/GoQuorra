<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoQuorra</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style nonce="{{.Nonce}}">
:root {
  --ink: #16191d; --dim: #5b6670; --line: #dfe3e8;
  --ground: #f5f6f8; --panel: #ffffff;
  --pending: #9a6700; --leased: #0b5ed7; --succeeded: #1a7f37; --dead: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e6e9ec; --dim: #98a1ab; --line: #2c333b;
    --ground: #14171a; --panel: #1c2126;
    --pending: #d4a72c; --leased: #6cb6ff; --succeeded: #57ab5a; --dead: #ff7b72;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
header { border-bottom: 1px solid var(--line); background: var(--panel); }
.bar { max-width: 1100px; margin: 0 auto; padding: 18px 20px; display: flex; gap: 12px; align-items: baseline; }
h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
/* The bar lines its children up on the baseline, which a picture has none
   of, so the mark is centred against the row instead. */
.mark { width: 26px; height: 26px; align-self: center; border-radius: 7px; }
/* The spacer that pushes the key form to the right edge.
   It is a class and not a style attribute. The policy on this page names a
   nonce for style, and a nonce does not apply to an attribute, so an inline
   style is refused by the browser and does nothing. That failure is silent
   apart from a line in a console nobody has open. */
.spacer { flex: 1; }
.tag { color: var(--dim); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--dim); }
.row { display: flex; justify-content: space-between; padding: 2px 0; font-variant-numeric: tabular-nums; }
h3 { font-size: 14px; margin: 0 0 10px; color: var(--dim); font-weight: 600; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.pending { color: var(--pending); } .leased { color: var(--leased); }
.succeeded { color: var(--succeeded); } .dead { color: var(--dead); }
.note { color: var(--dim); padding: 16px; }
form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input, button {
  font: inherit; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
button { cursor: pointer; }
.err { color: var(--dead); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.filters button { font-size: 13px; padding: 5px 11px; }
.filters button[aria-pressed="true"] { border-color: var(--leased); color: var(--leased); font-weight: 600; }
td.act { white-space: nowrap; }
/* The error is the widest thing on the row and the least urgent. Capped with
   the full text on the title, so it cannot push the buttons at the end of the
   row off the side of the table. */
td.why { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
td.waiting { color: var(--muted); }
td.act button { font-size: 12px; padding: 3px 9px; margin-right: 5px; }
.more { padding: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <!-- The mark is decorative, and the heading beside it already says the
         name. An alt holding that name again would have a screen reader read
         it twice. -->
    <img class="mark" src="/logo.svg" alt="" width="26" height="26">
    <h1>GoQuorra</h1>
    <span class="tag" id="state">connecting</span>
    <span class="spacer"></span>
    <form id="keyform">
      <label for="key" class="tag">API key</label>
      <input id="key" type="password" autocomplete="off" size="26" placeholder="X-API-Key">
      <button type="submit">Use</button>
    </form>
  </div>
</header>

<main>
  <h3>Queues</h3>
  <div class="cards" id="queues"></div>

  <h3>Jobs</h3>
  <div class="filters" id="filters"></div>
  <div class="scroll">
    <table>
      <thead>
        <tr><th>Job</th><th>Type</th><th>Queue</th><th>Status</th><th>Attempts</th><th>Created</th><th>Runs at</th><th>Outcome</th><th>Actions</th></tr>
      </thead>
      <tbody id="jobs"></tbody>
    </table>
    <div class="more" id="more"></div>
  </div>
</main>

<script nonce="{{.Nonce}}">
// The key is never written into this page.
//
// The old dashboard had the key printed into its source and sent it in the
// query string of every request. A query string is written to the access log
// of every proxy, kept in browser history, and sent on in the Referer header.
// The reader supplies the key here, the browser keeps it for this tab only,
// and it travels in a header.
"use strict";

const store = window.sessionStorage;
const state = document.getElementById("state");
const keyInput = document.getElementById("key");

keyInput.value = store.getItem("quorra.key") || "";

document.getElementById("keyform").addEventListener("submit", (event) => {
  event.preventDefault();
  store.setItem("quorra.key", keyInput.value);
  load();
});

function say(text, bad) {
  state.textContent = text;
  state.className = bad ? "tag err" : "tag";
}

// Which status the reader is looking at. Empty means all of them.
let filter = "";

async function post(path) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "X-API-Key": store.getItem("quorra.key") || "" },
  });
  if (!response.ok) {
    const answer = await response.json().catch(() => ({}));
    throw new Error(answer.error || ("the server answered " + response.status));
  }
  return response.json();
}

async function get(path) {
  const response = await fetch(path, {
    headers: { "X-API-Key": store.getItem("quorra.key") || "" },
    cache: "no-store",
  });
  if (response.status === 401) throw new Error("the API key is missing or wrong");
  if (!response.ok) throw new Error("the server answered " + response.status);
  return response.json();
}

// Every value below is written with textContent or through createTextNode.
//
// The old dashboard built each row by joining strings and assigning the
// result straight into the page as markup. Two of the values in a row, the
// job type and the queue name, are chosen by whoever submits a job, so
// anybody who could reach the submission endpoint could put a script into
// this page and have it run with the reader's key in their browser.
function cell(row, text, className) {
  const td = document.createElement("td");
  td.textContent = text === null || text === undefined ? "" : String(text);
  if (className) td.className = className;
  row.appendChild(td);
  return td;
}

function renderQueues(rows) {
  const byQueue = new Map();
  for (const row of rows) {
    if (!byQueue.has(row.queue)) byQueue.set(row.queue, []);
    byQueue.get(row.queue).push(row);
  }

  const holder = document.getElementById("queues");
  holder.replaceChildren();

  if (byQueue.size === 0) {
    const empty = document.createElement("div");
    empty.className = "card note";
    empty.textContent = "No jobs yet.";
    holder.appendChild(empty);
    return;
  }

  for (const [queue, counts] of [...byQueue].sort()) {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = queue;
    card.appendChild(title);

    for (const entry of counts) {
      const line = document.createElement("div");
      line.className = "row";

      const name = document.createElement("span");
      name.textContent = entry.status;
      name.className = entry.status;

      const value = document.createElement("span");
      value.textContent = entry.count;

      line.append(name, value);
      card.appendChild(line);
    }
    holder.appendChild(card);
  }
}

// The statuses the filter row offers. Taken from what the server can hold,
// not from what happens to be in the table right now, so a status with no
// jobs in it is still a button somebody can press.
const STATUSES = ["pending", "leased", "succeeded", "dead", "cancelled"];

function renderFilters() {
  const holder = document.getElementById("filters");
  holder.replaceChildren();

  // ready is not a status, so it is not in STATUSES. It sits in the same row
  // because it answers the same question a reader is asking when they press
  // one of these: show me less than everything.
  const choices = [["", "all"]].concat(STATUSES.map((s) => [s, s])).concat([["ready", "ready"]]);

  for (const [value, label] of choices) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", String(filter === value));
    button.addEventListener("click", () => {
      filter = value;
      renderFilters();
      load();
    });
    holder.appendChild(button);
  }
}

// untilText says how far off a moment is, in the shortest form that is still
// true. A job that is ready reads as "now" rather than as a negative number.
function untilText(moment) {
  const seconds = Math.round((moment - new Date()) / 1000);
  if (seconds <= 0) return "now";
  if (seconds < 60) return "in " + seconds + "s";
  if (seconds < 3600) return "in " + Math.round(seconds / 60) + "m";
  if (seconds < 86400) return "in " + Math.round(seconds / 3600) + "h";
  return "in " + Math.round(seconds / 86400) + "d";
}

// A button that acts on one job, and says what happened where the reader is
// already looking rather than in a box they have to dismiss.
function action(row, label, path, id) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      await post("/v1/jobs/" + encodeURIComponent(id) + "/" + path);
      await load();
    } catch (error) {
      say(error.message, true);
      button.disabled = false;
    }
  });
  row.appendChild(button);
}

function renderJobs(list) {
  const body = document.getElementById("jobs");
  body.replaceChildren();
  document.getElementById("more").textContent = "";

  if (!list || list.length === 0) {
    const row = document.createElement("tr");
    const td = cell(row, filter ? "No " + filter + " jobs." : "No jobs yet.");
    td.colSpan = 9;
    td.className = "note";
    body.appendChild(row);
    return;
  }

  for (const job of list) {
    const row = document.createElement("tr");

    const first = cell(row, "");
    const id = document.createElement("code");
    id.textContent = String(job.id).slice(0, 8);
    id.title = job.id;
    first.appendChild(id);

    cell(row, job.type);
    cell(row, job.queue);
    cell(row, job.status, job.status);
    cell(row, job.attempts + " of " + (job.max_retries + 1));
    // A short form for today and a date for anything older. The full moment
    // is on the title. A column holding the date and the seconds of every
    // row is the widest thing in the table and is read by nobody.
    const created = new Date(job.created_at);
    const today = new Date().toDateString() === created.toDateString();
    const when = cell(row, today
      ? created.toLocaleTimeString()
      : created.toLocaleDateString());
    when.title = created.toLocaleString();

    // When the job runs, and how far off that is.
    //
    // A job pending with a run_at two hours out looks exactly like one that
    // is ready this second in every other column on this row. The relative
    // form is what a reader wants: "in 2h" answers the question, and the
    // moment itself hangs off the cell for whoever needs it.
    const runs = new Date(job.run_at);
    const runsCell = cell(row, job.status === "pending" ? untilText(runs) : "");
    runsCell.title = runs.toLocaleString();
    if (job.status === "pending" && runs > new Date()) {
      runsCell.className = "waiting";
    }

    // One column for what came of the job, because a job has an error or a
    // result and never both worth showing.
    //
    // The column is headed Outcome and not Last error. It held that name
    // while it also showed the word "result", which put a successful job
    // under a heading that says it failed.
    //
    // The status decides which of the two is shown, and not which field
    // happens to be filled in. last_error is deliberately kept when a job
    // succeeds, so a job that failed once and then worked carries both, and
    // preferring the error showed the stale failure and hid what the job
    // actually produced.
    const succeeded = job.status === "succeeded";
    const last = cell(row, "");
    last.className = "why";
    if (succeeded && job.result) {
      last.textContent = "result";
      last.title = JSON.stringify(job.result);
    } else if (!succeeded && job.last_error) {
      last.textContent = job.last_error;
      last.title = job.last_error;
    }

    // Only the actions the server would accept. A button that always answers
    // 409 teaches the reader to ignore the row.
    const acts = cell(row, "");
    acts.className = "act";
    if (job.status === "pending" || job.status === "leased") {
      action(acts, "cancel", "cancel", job.id);
    }
    if (job.status === "dead" || job.status === "cancelled") {
      action(acts, "revive", "revive", job.id);
    }

    body.appendChild(row);
  }
}

async function load() {
  if (!store.getItem("quorra.key")) {
    say("enter the API key", true);
    return;
  }
  try {
    // ready asks a different question from a status, so it builds a
    // different query: what the queue would hand out now, in the order it
    // would hand it out. A list of ready jobs in submission order does not
    // answer what runs next.
    let path = "/v1/jobs?limit=25";
    if (filter === "ready") {
      // Pending as well as due. A finished job keeps the run_at of its last
      // attempt, so asking only what is due lists every job that has ever
      // run, which is the opposite of what this button says.
      path += "&status=pending&due=now&order=soonest";
    } else if (filter) {
      path += "&status=" + encodeURIComponent(filter);
    }
    const [queues, jobs] = await Promise.all([get("/v1/queues"), get(path)]);
    renderQueues(queues.queues || []);
    renderJobs(jobs.jobs || []);
    if (jobs.next_cursor) {
      document.getElementById("more").textContent =
        "Showing the newest 25. Use quorractl list -all to see the rest.";
    }
    say("updated " + new Date().toLocaleTimeString());
  } catch (error) {
    say(error.message, true);
  }
}

renderFilters();
load();
setInterval(load, 5000);
</script>
</body>
</html>
