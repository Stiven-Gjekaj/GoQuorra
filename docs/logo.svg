<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="GoQuorra">
  <title>GoQuorra</title>

  <!--
    Drawn for this project. Nothing in it comes from an icon set, so the
    repository carries no third party licence for the mark.

    It is a queue and not a letter, although it reads as one. The ring is a
    run of separate segments, because that is what a queue is: discrete jobs
    waiting their turn rather than a continuous thing. The arrow is a job
    leaving to be worked on, and the ring it leaves is the loop it comes back
    to when it fails. That loop is what this project is about.

    Five segments, and the number is not arbitrary. At r=18 the circumference
    is 113.097, so a dash and gap of 22.619 divides it exactly five times and
    the ring closes with no seam. Six segments also divide it, and at this
    stroke width they blur into each other below about 24 pixels.

    The ground is drawn in, so the mark reads on a light page and a dark one
    without a second file.
  -->

  <defs>
    <linearGradient id="quorra-accent" x1="18" y1="18" x2="78" y2="78"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BE7D4"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
    <linearGradient id="quorra-ground" x1="0" y1="0" x2="96" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#quorra-ground)"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none"
        stroke="#1c2739" stroke-width="1.5"/>

  <g fill="none" stroke="url(#quorra-accent)" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="36" cy="48" r="18" stroke-dasharray="9 13.619" stroke-dashoffset="4.5"/>
    <path d="M64 48 H81"/>
    <path d="M74.5 41.5 L81 48 L74.5 54.5"/>
  </g>
</svg>
