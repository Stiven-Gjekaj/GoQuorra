name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A push that lands while an earlier run is still going cancels it. The older
# run is testing code nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"

jobs:
  verify:
    name: Format, vet, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A check and not a rewrite. A step that reformats cannot fail, so the
      # run would report success and leave the difference in the working tree
      # of whoever pulled next.
      - name: Check the formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build the binaries
        run: make build

      # The race detector, always. Every part of this project is a server
      # answering several callers at once, and a data race in one of them
      # shows up as a job that ran twice, months later, with nothing in the
      # logs to explain it.
      #
      # This run needs no database. internal/jobs is pure and the store
      # contract suite runs against the in-memory store, which is the whole
      # reason it exists.
      - name: Test
        run: make test

  postgres:
    name: Test against a real database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quorra_test
          POSTGRES_USER: quorra
          POSTGRES_PASSWORD: quorra
        options: >-
          --health-cmd "pg_isready -U quorra -d quorra_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # QUORRA_TEST_REQUIRE_POSTGRES turns a skip into a failure.
      #
      # This is the step that the old workflow could not have. Its suite
      # skipped every test when the database was missing, so the run reported
      # success having tested nothing, and the badge on the README said so for
      # a repository that did not compile.
      - name: Run the store contract suite against PostgreSQL
        env:
          QUORRA_TEST_DATABASE_URL: postgres://quorra:quorra@localhost:5432/quorra_test?sslmode=disable
          QUORRA_TEST_REQUIRE_POSTGRES: "1"
        run: go test -race -count=1 ./...

      # Proof that the suite ran rather than skipped, printed where a reader
      # of the log can see it. A count is cheap and a silent skip is not.
      - name: Count the cases that ran
        env:
          QUORRA_TEST_DATABASE_URL: postgres://quorra:quorra@localhost:5432/quorra_test?sslmode=disable
          QUORRA_TEST_REQUIRE_POSTGRES: "1"
        run: |
          ran=$(go test -count=1 -v -run TestPostgresStore ./internal/store/postgres/ | grep -c '^    --- PASS' || true)
          echo "$ran contract cases passed against PostgreSQL."
          test "$ran" -gt 0

  protocol:
    name: Check the generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The check this repository owes its reader.
      #
      # The version before the rebuild carried two files headed "Code
      # generated by protoc-gen-go. DO NOT EDIT." that were written by hand.
      # Their messages were plain structs, so gRPC refused every call at run
      # time, and nothing in the build or the tests could see it. Generating
      # the code here and comparing it with what is committed is what makes
      # that impossible to do again.
      - name: Regenerate and compare
        run: make proto-check

  docs:
    name: Check the documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A broken relative link reads exactly like a working one, so nobody
      # finds it until they follow it.
      - name: Check that every relative link resolves
        run: bash scripts/check-links.sh

  stack:
    name: Run the whole stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        working-directory: deployments
        run: docker compose up --build --detach --wait

      # A submitted job must reach a worker and come back done. Everything
      # else in this file tests a part; this tests that the parts are wired
      # to each other.
      - name: Submit a job and wait for it
        run: bash scripts/smoke.sh

      - name: Show the logs when something fails
        if: failure()
        working-directory: deployments
        run: docker compose logs

      - name: Stop the stack
        if: always()
        working-directory: deployments
        run: docker compose down -v
