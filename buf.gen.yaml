# Where the generated code goes.
#
# The output is committed, and CI regenerates it and fails on a difference.
# That check is the point: the version of this repository before the rebuild
# carried files headed "Code generated by protoc-gen-go. DO NOT EDIT." that
# were written by hand. Their messages were plain structs rather than
# protobuf messages, so the gRPC codec refused every call at run time.
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/Stiven-Gjekaj/GoQuorra
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/Stiven-Gjekaj/GoQuorra
