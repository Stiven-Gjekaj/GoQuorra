# The whole stack, for trying it out and for the integration tests.
#
# There is no Redis. The old stack ran one, and the only thing anything did
# with it was publish a message to a channel that nothing subscribed to.

name: goquorra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quorra
      POSTGRES_USER: quorra
      POSTGRES_PASSWORD: quorra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied once, when the data directory is first created.
      - ../migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorra -d quorra"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/usr/local/bin/quorra-server"]
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUORRA_HTTP_ADDR: ":8080"
      QUORRA_GRPC_ADDR: ":50051"
      QUORRA_LOG_LEVEL: "info"
      DATABASE_URL: "postgres://quorra:quorra@postgres:5432/quorra?sslmode=disable"
      # A development key, and it is only safe because this stack is not
      # reachable from anywhere else. Generate a real one before this goes
      # anywhere: openssl rand -hex 32
      QUORRA_API_KEY: "local-development-key-not-for-anywhere-else"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # readyz and not healthz. readyz reaches the database, so a server that
      # is running and cannot see PostgreSQL is not reported as ready, and the
      # workers below wait rather than starting into a wall of errors.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  worker-one:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/usr/local/bin/quorra-worker"]
    environment:
      QUORRA_WORKER_ID: "worker-one"
      QUORRA_WORKER_QUEUES: "default,email"
      QUORRA_WORKER_MAX_JOBS: "5"
      QUORRA_WORKER_LEASE_TTL: "30s"
      QUORRA_SHUTDOWN_GRACE: "25s"
      QUORRA_GRPC_ADDR: "server:50051"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  worker-two:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/usr/local/bin/quorra-worker"]
    environment:
      QUORRA_WORKER_ID: "worker-two"
      QUORRA_WORKER_QUEUES: "default"
      QUORRA_WORKER_MAX_JOBS: "3"
      QUORRA_WORKER_LEASE_TTL: "30s"
      QUORRA_SHUTDOWN_GRACE: "25s"
      QUORRA_GRPC_ADDR: "server:50051"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
